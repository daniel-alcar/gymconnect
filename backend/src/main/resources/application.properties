spring.application.name=gymconnect

spring.jpa.hibernate.ddl-auto=update

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/gymconnect

spring.datasource.username=root

spring.datasource.password=123456

logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.http.converter.json=DEBUG

spring.jackson.serialization.write-dates-as-timestamps=false

api.security.token.secret=${JWT_SECRET:my-secret-key}


gemini.api-key=${keigemini}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
